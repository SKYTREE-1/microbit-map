<!doctype html>

<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>micro:bit 地図案内ミニサンプル</title>

<style>
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  max-width:900px;
  margin:24px auto;
  padding:0 16px;
  line-height:1.6
}

button{
  font-size:16px;
  padding:10px 16px;
  margin:4px;
  cursor:pointer
}

#status{
  padding:10px;
  background:#f3f3f3;
  border-radius:8px;
  margin:12px 0
}

.map{
  display:grid;
  grid-template-columns:repeat(5,70px);
  gap:6px;
  margin:20px 0
}

.cell{
  height:60px;
  border:1px solid #bbb;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  background:#fafafa
}

.wall{
  background:#ddd
}

.current{
  outline:3px solid #333
}

.goal{
  background:#eee;
  font-weight:bold
}

.path{
  background:#e8eef7
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:4px
}

.small{
  font-size:14px;
  color:#555
}
</style>

</head>

<body>
<p class="small">バージョン：2026-09-24-03</p>

<h1>micro:bit × Web地図 ミニサンプル</h1>

<p>
地図上で「現在地」と「目的地」を選び、
矢印をmicro:bitのLEDに表示するミニサンプル。
</p>

<div id="status">micro:bit：未接続</div>

<button id="connect">micro:bitに接続</button> <button id="disconnect" disabled>切断</button>

<h2>建物の簡単な地図</h2>

<p class="small">
「現在地」または「目的地」を選んでから、地図のマスをクリックしてください。
</p>

<div class="controls">
  <button id="setCurrent">現在地を設定</button>
  <button id="setGoal">目的地を設定</button>
  <button id="route">経路を表示</button>
  <button id="send">micro:bitへ案内を送る</button>
</div>

<div id="map" class="map" aria-label="簡単な建物地図"></div>

<p id="info">
現在地：未設定　目的地：未設定
</p>

<p class="small">
このサンプルでは、経路は上下左右に進む単純な経路です。
実際の建物の地図ではありません。
</p>

<hr>

<h2>micro:bitからの受信</h2>

<div>
  受信回数：<span id="count">0</span>
</div>

<div>
  最後に受信：<span id="last">---</span>
</div>

<script>

// ============================================================
// Nordic UART Service (NUS)
// 名前とUUIDはNUSの定義に合わせる
// ============================================================

const UART_SERVICE =
  "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

// NUS TX：micro:bit → Web
const UART_TX =
  "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

// NUS RX：Web → micro:bit
const UART_RX =
  "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


// ============================================================
// Bluetooth
// ============================================================

let device = null;

// micro:bit → Web
let txChar = null;

// Web → micro:bit
let rxChar = null;


// ============================================================
// 地図
// ============================================================

let mode = "current";
let current = null;
let goal = null;
let routeCells = [];


// ============================================================
// 受信
// ============================================================

let count = 0;


// ============================================================
// HTML要素
// ============================================================

const mapEl = document.getElementById("map");
const statusEl = document.getElementById("status");
const infoEl = document.getElementById("info");


// ============================================================
// 地図を作る
// ============================================================

for(let r = 0; r < 5; r++){

  for(let c = 0; c < 5; c++){

    const d = document.createElement("button");

    d.className = "cell";
    d.type = "button";

    d.dataset.r = r;
    d.dataset.c = c;

    d.textContent = "";

    d.addEventListener("click", () => {

      const p = {
        r: Number(d.dataset.r),
        c: Number(d.dataset.c)
      };

      if(mode === "current"){
        current = p;
      }else{
        goal = p;
      }

      draw();
    });

    mapEl.appendChild(d);
  }
}


// ============================================================
// 地図を描画
// ============================================================

function draw(){

  [...mapEl.children].forEach((d, i) => {

    const r = Math.floor(i / 5);
    const c = i % 5;

    d.className = "cell";
    d.textContent = "";

    if(
      current &&
      r === current.r &&
      c === current.c
    ){
      d.classList.add("current");
      d.textContent = "現在地";
    }

    if(
      goal &&
      r === goal.r &&
      c === goal.c
    ){
      d.classList.add("goal");
      d.textContent = "目的地";
    }

    if(
      routeCells.some(p => p.r === r && p.c === c) &&
      !(current && r === current.r && c === current.c) &&
      !(goal && r === goal.r && c === goal.c)
    ){
      d.classList.add("path");
      d.textContent = "・";
    }

  });

  infoEl.textContent =
    `現在地：${
      current
        ? `${current.r + 1},${current.c + 1}`
        : "未設定"
    }　目的地：${
      goal
        ? `${goal.r + 1},${goal.c + 1}`
        : "未設定"
    }`;
}


// ============================================================
// 現在地・目的地の設定
// ============================================================

document.getElementById("setCurrent").onclick = () => {
  mode = "current";
};

document.getElementById("setGoal").onclick = () => {
  mode = "goal";
};


// ============================================================
// 経路を作る
// ============================================================

function makeRoute(){

  routeCells = [];

  if(!current || !goal){
    return;
  }

  let p = {...current};

  while(p.r !== goal.r){

    p = {
      r: p.r + (goal.r > p.r ? 1 : -1),
      c: p.c
    };

    routeCells.push({...p});
  }

  while(p.c !== goal.c){

    p = {
      r: p.r,
      c: p.c + (goal.c > p.c ? 1 : -1)
    };

    routeCells.push({...p});
  }

  draw();
}

document.getElementById("route").onclick = makeRoute;


// ============================================================
// micro:bitに接続
// ============================================================

async function connect(){

  if(!navigator.bluetooth){

    alert(
      "このChromeではWeb Bluetoothが利用できません。" +
      "対応ブラウザで開いているか確認してください。"
    );

    return;
  }

  try{

    statusEl.textContent =
      "micro:bitを選択してください…";

    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [UART_SERVICE]
    });


    device.addEventListener(
      "gattserverdisconnected",
      () => {

        statusEl.textContent =
          "micro:bit：切断";

        txChar = null;
        rxChar = null;

        document.getElementById("disconnect").disabled = true;
      }
    );


    const server = await device.gatt.connect();

    const service =
      await server.getPrimaryService(UART_SERVICE);


    // --------------------------------------------------------
    // NUS TX
    // micro:bit → Web
    // --------------------------------------------------------

    txChar =
      await service.getCharacteristic(UART_TX);


    // --------------------------------------------------------
    // NUS RX
    // Web → micro:bit
    // --------------------------------------------------------

    rxChar =
      await service.getCharacteristic(UART_RX);


    // --------------------------------------------------------
    // micro:bit → Web の受信を開始
    // --------------------------------------------------------


    console.log("TX properties:", txChar.properties);
    console.log("RX properties:", rxChar.properties);


    statusEl.textContent =
      "micro:bit：接続しました";

    document.getElementById("disconnect").disabled =
      false;

  }catch(e){

    statusEl.textContent =
      "接続できませんでした：" +
      e.message;

    console.error(e);
  }
}

document.getElementById("connect").onclick =
  connect;


// ============================================================
// 切断
// ============================================================

document.getElementById("disconnect").onclick = () => {

  if(device && device.gatt.connected){

    device.gatt.disconnect();
  }
};


// ============================================================
// Web → micro:bit 送信
// ============================================================

async function sendChar(ch){

  if(!rxChar){

    alert(
      "先にmicro:bitへ接続してください。"
    );

    return;
  }

  try{

    const data =
      new TextEncoder().encode(ch + "\n");


    if(rxChar.properties.writeWithoutResponse){

      await rxChar.writeValueWithoutResponse(data);

    }else if(rxChar.properties.write){

      await rxChar.writeValue(data);

    }else{

      throw new Error(
        "NUS RXに書き込み機能がありません。"
      );
    }


    statusEl.textContent =
      "micro:bitへ送信: " + ch;

  }catch(e){

    statusEl.textContent =
      "送信エラー: " + e.message;

    console.error(e);
  }
}


// ============================================================
// 経路をmicro:bitへ送る
// ============================================================

document.getElementById("send").onclick =
  async () => {

    if(!current || !goal){

      alert(
        "現在地と目的地を設定してください。"
      );

      return;
    }


    makeRoute();

    await sendChar("S");


    // 現在地と目的地が同じ場合
    if(!routeCells.length){

      await sendChar("X");

      return;
    }

  

    for(let i = 0; i < routeCells.length; i++){

      const p = routeCells[i];

      let prev = current;

      if(i > 0){

        prev = routeCells[i - 1];
      }


      let ch = "X";


      if(p.r < prev.r){
        ch = "U";
      }

      if(p.r > prev.r){
        ch = "D";
      }

      if(p.c < prev.c){
        ch = "L";
      }

      if(p.c > prev.c){
        ch = "R";
      }


      await sendChar(ch);

      await new Promise(
        resolve => setTimeout(resolve, 500)
      );
    }


    await sendChar("X");
  };


// ============================================================
// 初期表示
// ============================================================

draw();

</script>

</body>
</html>
