<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>micro:bit 地図案内ミニサンプル</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.6}
button{font-size:16px;padding:10px 16px;margin:4px;cursor:pointer}
#status{padding:10px;background:#f3f3f3;border-radius:8px;margin:12px 0}
.map{display:grid;grid-template-columns:repeat(5,70px);gap:6px;margin:20px 0}
.cell{height:60px;border:1px solid #bbb;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#fafafa}
.wall{background:#ddd}.current{outline:3px solid #333}.goal{background:#eee;font-weight:bold}
.path{background:#e8eef7}
.controls{display:flex;flex-wrap:wrap;gap:4px}
.small{font-size:14px;color:#555}
</style>
</head>
<body>
<h1>micro:bit × Web地図 ミニサンプル</h1>
<p>地図上で「現在地」と「目的地」を選び、矢印をmicro:bitのLEDに表示する最小構成です。</p>

<div id="status">micro:bit：未接続</div>
<button id="connect">micro:bitに接続</button>
<button id="disconnect" disabled>切断</button>

<h2>建物の簡単な地図</h2>
<p class="small">「現在地」または「目的地」を選んでから、地図のマスをクリックしてください。</p>
<div class="controls">
  <button id="setCurrent">現在地を設定</button>
  <button id="setGoal">目的地を設定</button>
  <button id="route">経路を表示</button>
  <button id="send">micro:bitへ案内を送る</button>
</div>
<div id="map" class="map" aria-label="簡単な建物地図"></div>
<p id="info">現在地：未設定　目的地：未設定</p>
<p class="small">このサンプルでは、経路は上下左右に進む単純な経路です。実際の建物の地図ではありません。</p>

<div>受信回数：<span id="count">0</span></div>
<div>最後に受信：<span id="last">---</span></div>  

<script>
const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_TX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // PC → micro:bit
const UART_RX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // micro:bit → PC
let device=null, rxChar=null; txChar=null;
let mode="current", current=null, goal=null, routeCells=[];
let count = 0;

const mapEl=document.getElementById("map");
const statusEl=document.getElementById("status");
const infoEl=document.getElementById("info");

for(let r=0;r<5;r++){
  for(let c=0;c<5;c++){
    const d=document.createElement("button");
    d.className="cell";
    d.type="button";
    d.dataset.r=r; d.dataset.c=c;
    d.textContent="";
    d.addEventListener("click",()=>{
      const p={r:Number(d.dataset.r),c:Number(d.dataset.c)};
      if(mode==="current") current=p; else goal=p;
      draw();
    });
    mapEl.appendChild(d);
  }
}

function draw(){
  [...mapEl.children].forEach((d,i)=>{
    const r=Math.floor(i/5),c=i%5;
    d.className="cell";
    d.textContent="";
    if(current&&r===current.r&&c===current.c){d.classList.add("current");d.textContent="現在地";}
    if(goal&&r===goal.r&&c===goal.c){d.classList.add("goal");d.textContent="目的地";}
    if(routeCells.some(p=>p.r===r&&p.c===c) && !(current&&r===current.r&&c===current.c) && !(goal&&r===goal.r&&c===goal.c)){
      d.classList.add("path"); d.textContent="・";
    }
  });
  infoEl.textContent=`現在地：${current?`${current.r+1},${current.c+1}`:"未設定"}　目的地：${goal?`${goal.r+1},${goal.c+1}`:"未設定"}`;
}

document.getElementById("setCurrent").onclick=()=>mode="current";
document.getElementById("setGoal").onclick=()=>mode="goal";

function makeRoute(){
  routeCells=[];
  if(!current||!goal) return;
  let p={...current};
  while(p.r!==goal.r){p={r:p.r+(goal.r>p.r?1:-1),c:p.c};routeCells.push({...p});}
  while(p.c!==goal.c){p={r:p.r,c:p.c+(goal.c>p.c?1:-1)};routeCells.push({...p});}
  draw();
}
document.getElementById("route").onclick=makeRoute;

async function connect(){
  if(!navigator.bluetooth){alert("このChromeではWeb Bluetoothが利用できません。Windows版Chromeで開いているか確認してください。");return;}
  try{
    statusEl.textContent="micro:bitを選択してください…";
    //device=await navigator.bluetooth.requestDevice({filters:[{services:[UART_SERVICE]}]});
    device=await navigator.bluetooth.requestDevice({acceptAllDevices: true,optionalServices: [UART_SERVICE]});
    device.addEventListener("gattserverdisconnected",()=>{statusEl.textContent="micro:bit：切断";txChar=null;});
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(UART_SERVICE);
    txChar=await service.getCharacteristic(UART_TX);
    
    // micro:bit → Web の受信
    //rxChar=await service.getCharacteristic(UART_RX);
    //await rxChar.startNotifications();
    
    //rxChar.addEventListener("characteristicvaluechanged", (event)=>{
    //  const text=new TextDecoder().decode(event.target.value).trim();
    //  console.log("受信:", text);
    //  count++;
    //  document.getElementById("count").textContent=count;
    //  document.getElementById("last").textContent=text;
   // });

    statusEl.textContent="micro:bit：接続しました";
    document.getElementById("disconnect").disabled=false;
  }catch(e){
    statusEl.textContent="接続できませんでした："+e.message;
  }
  
  // -- write log
  console.log("TX characteristic:", txChar);
  console.log("TX properties:", txChar.properties);
  //console.log("RX characteristic:", rxChar);
  //console.log("RX properties:", rxChar.properties);

  
}
document.getElementById("connect").onclick=connect;

document.getElementById("disconnect").onclick=()=>{
  if(device&&device.gatt.connected) device.gatt.disconnect();
};

async function sendChar(ch){
  if(!txChar){alert("先にmicro:bitへ接続してください。");return;}
  try {
    const data = new TextEncoder().encode(ch + "\n");
    //await txChar.writeValue(data);
    await txChar.writeValueWithoutResponse(data);
    statusEl.textContent = "micro:bitへ送信: " + ch;
  } catch(e) {
    statusEl.textContent = "送信エラー: " + e.message;
    console.error(e);
  }
  //const data=new TextEncoder().encode(ch+"\n");
  //await txChar.writeValue(data);
}

document.getElementById("send").onclick=async()=>{
  if(!current||!goal){alert("現在地と目的地を設定してください。");return;}
  makeRoute();
  if(!routeCells.length){await sendChar("X");return;}
  for(const p of routeCells){
    let prev=current;
    // routeCells is an ordered list from current to goal
    const idx=routeCells.indexOf(p);
    if(idx>0) prev=routeCells[idx-1];
    let ch="X";
    if(p.r<prev.r) ch="U";
    if(p.r>prev.r) ch="D";
    if(p.c<prev.c) ch="L";
    if(p.c>prev.c) ch="R";
    await sendChar(ch);
    await new Promise(res=>setTimeout(res,500));
  }
  await sendChar("X");
};

  
draw();
  
</script>
</body>
</html>
